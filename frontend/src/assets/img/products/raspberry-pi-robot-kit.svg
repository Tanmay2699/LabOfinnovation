<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Four-wheel robot car chassis carrying a Raspberry Pi 4 board and a front camera module">
  <defs>
    <linearGradient id="pi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2aa35a"/>
      <stop offset="1" stop-color="#16773d"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#a1aab5"/>
    </linearGradient>
    <linearGradient id="acrylic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4150"/>
      <stop offset="1" stop-color="#262b36"/>
    </linearGradient>
    <pattern id="tread" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#1a1b1f"/>
      <rect y="0" width="8" height="3" fill="#2b2d33"/>
    </pattern>
  </defs>

  <ellipse cx="200" cy="360" rx="150" ry="14" fill="#000" opacity="0.28"/>

  <!-- wheels -->
  <g stroke="#0e0f12" stroke-width="2">
    <rect x="52" y="70" width="40" height="92" rx="10" fill="url(#tread)"/>
    <rect x="308" y="70" width="40" height="92" rx="10" fill="url(#tread)"/>
    <rect x="52" y="238" width="40" height="92" rx="10" fill="url(#tread)"/>
    <rect x="308" y="238" width="40" height="92" rx="10" fill="url(#tread)"/>
  </g>
  <!-- yellow TT motors to each wheel -->
  <g fill="#f2c230" stroke="#b8901c" stroke-width="2">
    <rect x="90" y="96" width="44" height="40" rx="5"/>
    <rect x="266" y="96" width="44" height="40" rx="5"/>
    <rect x="90" y="264" width="44" height="40" rx="5"/>
    <rect x="266" y="264" width="44" height="40" rx="5"/>
  </g>

  <!-- acrylic chassis -->
  <rect x="104" y="58" width="192" height="284" rx="18" fill="url(#acrylic)" stroke="#59627a" stroke-width="2" opacity="0.96"/>
  <g fill="#161a22">
    <circle cx="122" cy="76" r="4"/><circle cx="278" cy="76" r="4"/><circle cx="122" cy="324" r="4"/><circle cx="278" cy="324" r="4"/>
  </g>

  <!-- 18650 battery holder -->
  <g transform="translate(126 250)">
    <rect width="148" height="72" rx="6" fill="#1d1f24" stroke="#3a3d44" stroke-width="2"/>
    <rect x="8" y="10" width="132" height="22" rx="11" fill="#3b6fd6"/>
    <rect x="8" y="40" width="132" height="22" rx="11" fill="#3b6fd6"/>
    <rect x="132" y="15" width="8" height="12" rx="2" fill="url(#metal)"/>
    <rect x="132" y="45" width="8" height="12" rx="2" fill="url(#metal)"/>
  </g>

  <!-- Raspberry Pi 4 -->
  <g transform="translate(120 110)">
    <rect width="160" height="120" rx="8" fill="url(#pi)" stroke="#0f5a2d" stroke-width="2"/>
    <g fill="#0f5a2d"><circle cx="10" cy="10" r="4"/><circle cx="150" cy="10" r="4"/><circle cx="10" cy="110" r="4"/><circle cx="150" cy="110" r="4"/></g>
    <!-- GPIO header -->
    <rect x="22" y="6" width="116" height="16" rx="2" fill="#1d1f24"/>
    <g fill="#d8b24c">
      <rect x="27" y="9" width="3" height="3"/><rect x="35" y="9" width="3" height="3"/><rect x="43" y="9" width="3" height="3"/><rect x="51" y="9" width="3" height="3"/><rect x="59" y="9" width="3" height="3"/><rect x="67" y="9" width="3" height="3"/><rect x="75" y="9" width="3" height="3"/><rect x="83" y="9" width="3" height="3"/><rect x="91" y="9" width="3" height="3"/><rect x="99" y="9" width="3" height="3"/><rect x="107" y="9" width="3" height="3"/><rect x="115" y="9" width="3" height="3"/><rect x="123" y="9" width="3" height="3"/><rect x="131" y="9" width="3" height="3"/>
      <rect x="27" y="16" width="3" height="3"/><rect x="35" y="16" width="3" height="3"/><rect x="43" y="16" width="3" height="3"/><rect x="51" y="16" width="3" height="3"/><rect x="59" y="16" width="3" height="3"/><rect x="67" y="16" width="3" height="3"/><rect x="75" y="16" width="3" height="3"/><rect x="83" y="16" width="3" height="3"/><rect x="91" y="16" width="3" height="3"/><rect x="99" y="16" width="3" height="3"/><rect x="107" y="16" width="3" height="3"/><rect x="115" y="16" width="3" height="3"/><rect x="123" y="16" width="3" height="3"/><rect x="131" y="16" width="3" height="3"/>
    </g>
    <!-- SoC, RAM, wireless shield -->
    <rect x="30" y="40" width="40" height="40" rx="3" fill="url(#metal)" stroke="#7d8692" stroke-width="1.5"/>
    <text x="50" y="64" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#4b5460" text-anchor="middle">BCM</text>
    <rect x="80" y="44" width="26" height="32" rx="2" fill="#1d1f24"/>
    <rect x="22" y="88" width="30" height="20" rx="2" fill="url(#metal)"/>
    <!-- USB + Ethernet on the trailing edge -->
    <rect x="118" y="30" width="46" height="26" rx="2" fill="url(#metal)" stroke="#7d8692" stroke-width="1.5"/>
    <rect x="118" y="60" width="46" height="26" rx="2" fill="url(#metal)" stroke="#7d8692" stroke-width="1.5"/>
    <rect x="124" y="38" width="34" height="10" rx="1" fill="#2f5fbf"/>
    <rect x="124" y="68" width="34" height="10" rx="1" fill="#1d1f24"/>
    <rect x="118" y="90" width="46" height="26" rx="2" fill="url(#metal)" stroke="#7d8692" stroke-width="1.5"/>
    <rect x="126" y="97" width="30" height="12" rx="1" fill="#1d1f24"/>
    <!-- status LEDs -->
    <circle cx="12" cy="60" r="3" fill="#ff5a4f"/>
    <circle cx="12" cy="70" r="3" fill="#8bf0a8"/>
  </g>

  <!-- ribbon cable to the camera -->
  <path d="M190 110 C 190 86, 200 80, 200 64" stroke="#e8e2d0" stroke-width="12" fill="none"/>

  <!-- camera module on its bracket at the nose -->
  <g transform="translate(174 22)">
    <rect x="-6" y="30" width="64" height="12" rx="3" fill="#1d1f24"/>
    <rect width="52" height="44" rx="4" fill="url(#pi)" stroke="#0f5a2d" stroke-width="2"/>
    <rect x="12" y="8" width="28" height="28" rx="3" fill="#1d1f24"/>
    <circle cx="26" cy="22" r="10" fill="#101216" stroke="#4a5060" stroke-width="2"/>
    <circle cx="26" cy="22" r="5" fill="#2e4d8f"/>
    <circle cx="23" cy="19" r="2" fill="#bcd0ff"/>
  </g>
</svg>
