<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Arduino Uno board wired to a breadboard with LEDs, a resistor and a DC gear motor">
  <defs>
    <pattern id="holes" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="4" height="4" rx="1" fill="#b9bec7"/>
    </pattern>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b93a8"/>
      <stop offset="1" stop-color="#0d6f84"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e7ec"/>
      <stop offset="1" stop-color="#9aa3ae"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="352" rx="165" ry="14" fill="#000" opacity="0.28"/>

  <!-- breadboard -->
  <g transform="translate(34 206)">
    <rect width="206" height="132" rx="8" fill="#eceef1" stroke="#c9ced6" stroke-width="2"/>
    <rect x="10" y="10" width="186" height="4" rx="2" fill="#d64545"/>
    <rect x="10" y="118" width="186" height="4" rx="2" fill="#3b6fd6"/>
    <rect x="10" y="18" width="186" height="14" fill="url(#holes)"/>
    <rect x="10" y="100" width="186" height="14" fill="url(#holes)"/>
    <rect x="10" y="38" width="186" height="24" fill="url(#holes)"/>
    <rect x="10" y="70" width="186" height="24" fill="url(#holes)"/>
    <rect x="8" y="63" width="190" height="6" rx="3" fill="#d4d8de"/>
  </g>

  <!-- LEDs + resistor on the breadboard -->
  <g>
    <path d="M86 262 v22 M96 262 v22" stroke="#b9bec7" stroke-width="3"/>
    <path d="M78 262 a13 13 0 0 1 26 0 v6 h-26 z" fill="#ff5a4f"/>
    <path d="M83 252 a6 6 0 0 1 8 -4" stroke="#ffd2cc" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M136 262 v22 M146 262 v22" stroke="#b9bec7" stroke-width="3"/>
    <path d="M128 262 a13 13 0 0 1 26 0 v6 h-26 z" fill="#3fd07a"/>
    <path d="M133 252 a6 6 0 0 1 8 -4" stroke="#c9f5d9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M168 300 h58" stroke="#b9bec7" stroke-width="3"/>
    <rect x="180" y="293" width="34" height="14" rx="7" fill="#d9b98a"/>
    <rect x="186" y="293" width="4" height="14" fill="#7a4a1f"/>
    <rect x="194" y="293" width="4" height="14" fill="#1b1b1b"/>
    <rect x="202" y="293" width="4" height="14" fill="#d64545"/>
  </g>

  <!-- Arduino Uno -->
  <g transform="translate(146 62)">
    <rect width="220" height="150" rx="10" fill="url(#pcb)" stroke="#0a5566" stroke-width="2"/>
    <circle cx="16" cy="16" r="5" fill="#0a5566"/>
    <circle cx="204" cy="16" r="5" fill="#0a5566"/>
    <circle cx="204" cy="134" r="5" fill="#0a5566"/>
    <!-- USB-B + DC jack overhang the left edge -->
    <rect x="-12" y="22" width="46" height="40" rx="3" fill="url(#metal)" stroke="#6f7882" stroke-width="2"/>
    <rect x="-8" y="98" width="38" height="32" rx="4" fill="#1d1f24"/>
    <circle cx="11" cy="114" r="8" fill="#3a3d44"/>
    <!-- headers -->
    <rect x="70" y="8" width="138" height="12" rx="2" fill="#1d1f24"/>
    <g fill="#c9a24a">
      <rect x="76" y="12" width="4" height="4"/><rect x="88" y="12" width="4" height="4"/><rect x="100" y="12" width="4" height="4"/><rect x="112" y="12" width="4" height="4"/><rect x="124" y="12" width="4" height="4"/><rect x="136" y="12" width="4" height="4"/><rect x="148" y="12" width="4" height="4"/><rect x="160" y="12" width="4" height="4"/><rect x="172" y="12" width="4" height="4"/><rect x="184" y="12" width="4" height="4"/><rect x="196" y="12" width="4" height="4"/>
    </g>
    <rect x="96" y="130" width="112" height="12" rx="2" fill="#1d1f24"/>
    <g fill="#c9a24a">
      <rect x="102" y="134" width="4" height="4"/><rect x="114" y="134" width="4" height="4"/><rect x="126" y="134" width="4" height="4"/><rect x="138" y="134" width="4" height="4"/><rect x="150" y="134" width="4" height="4"/><rect x="162" y="134" width="4" height="4"/><rect x="174" y="134" width="4" height="4"/><rect x="186" y="134" width="4" height="4"/><rect x="198" y="134" width="4" height="4"/>
    </g>
    <!-- ATmega328P DIP -->
    <rect x="88" y="92" width="112" height="26" rx="3" fill="#1d1f24"/>
    <g fill="#c7ccd3">
      <rect x="94" y="88" width="4" height="5"/><rect x="106" y="88" width="4" height="5"/><rect x="118" y="88" width="4" height="5"/><rect x="130" y="88" width="4" height="5"/><rect x="142" y="88" width="4" height="5"/><rect x="154" y="88" width="4" height="5"/><rect x="166" y="88" width="4" height="5"/><rect x="178" y="88" width="4" height="5"/><rect x="190" y="88" width="4" height="5"/>
      <rect x="94" y="117" width="4" height="5"/><rect x="106" y="117" width="4" height="5"/><rect x="118" y="117" width="4" height="5"/><rect x="130" y="117" width="4" height="5"/><rect x="142" y="117" width="4" height="5"/><rect x="154" y="117" width="4" height="5"/><rect x="166" y="117" width="4" height="5"/><rect x="178" y="117" width="4" height="5"/><rect x="190" y="117" width="4" height="5"/>
    </g>
    <circle cx="96" cy="105" r="3" fill="#3a3d44"/>
    <!-- reset, crystal, status LEDs, logo -->
    <rect x="46" y="30" width="16" height="16" rx="2" fill="#c7ccd3"/>
    <circle cx="54" cy="38" r="5" fill="#d64545"/>
    <rect x="52" y="66" width="24" height="10" rx="5" fill="url(#metal)"/>
    <circle cx="80" cy="40" r="3" fill="#ffd34d"/>
    <circle cx="80" cy="52" r="3" fill="#8bf0a8"/>
    <text x="176" y="76" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e9f6f8" text-anchor="middle">UNO</text>
    <path d="M103 60 a9 9 0 1 0 0.1 0 M115 60 a9 9 0 1 0 0.1 0" stroke="#e9f6f8" stroke-width="3" fill="none"/>
  </g>

  <!-- jumper wires, header to breadboard -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M254 206 C 250 240, 200 230, 191 262" stroke="#d64545"/>
    <path d="M278 206 C 276 250, 150 226, 141 244" stroke="#3fb57a"/>
    <path d="M302 206 C 300 262, 110 222, 91 244" stroke="#f2c230"/>
    <path d="M326 206 C 330 250, 240 258, 226 300" stroke="#1d1f24"/>
  </g>

  <!-- TT gear motor -->
  <g transform="translate(262 262)">
    <rect width="104" height="58" rx="8" fill="#f2c230" stroke="#b8901c" stroke-width="2"/>
    <rect x="10" y="10" width="46" height="38" rx="5" fill="#e1b12a"/>
    <circle cx="80" cy="29" r="12" fill="#f7d65c" stroke="#b8901c" stroke-width="2"/>
    <rect x="74" y="26" width="12" height="6" rx="1" fill="#f4f4f4"/>
    <rect x="-18" y="18" width="20" height="22" rx="4" fill="url(#metal)"/>
    <path d="M-18 24 h-14 M-18 34 h-14" stroke="#d64545" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
