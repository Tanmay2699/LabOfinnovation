<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Servo bundle: one MG996R metal-gear servo and two SG90 micro servos with horns and three-wire leads">
  <defs>
    <linearGradient id="sg90" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8ff0"/>
      <stop offset="1" stop-color="#2459c4"/>
    </linearGradient>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34373f"/>
      <stop offset="1" stop-color="#16181c"/>
    </linearGradient>
    <radialGradient id="alu" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f3f5f7"/>
      <stop offset="1" stop-color="#9ea7b2"/>
    </radialGradient>
  </defs>

  <ellipse cx="200" cy="358" rx="165" ry="14" fill="#000" opacity="0.28"/>

  <!-- leads: brown GND, red V+, orange signal -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M86 300 C 70 330, 120 346, 160 338" stroke="#6b3f1d"/>
    <path d="M92 300 C 80 326, 124 338, 162 331" stroke="#d64545"/>
    <path d="M98 300 C 90 322, 128 330, 164 324" stroke="#f08a24"/>
    <path d="M314 300 C 330 330, 280 346, 240 338" stroke="#6b3f1d"/>
    <path d="M308 300 C 320 326, 276 338, 238 331" stroke="#d64545"/>
    <path d="M302 300 C 310 322, 272 330, 236 324" stroke="#f08a24"/>
    <path d="M200 206 C 200 250, 196 290, 200 330" stroke="#6b3f1d"/>
    <path d="M207 206 C 207 250, 206 290, 208 330" stroke="#d64545"/>
    <path d="M214 206 C 214 250, 216 290, 216 330" stroke="#f08a24"/>
  </g>
  <!-- 3-pin connectors -->
  <g fill="#1d1f24">
    <rect x="156" y="318" width="22" height="26" rx="3"/>
    <rect x="222" y="318" width="22" height="26" rx="3"/>
    <rect x="194" y="326" width="28" height="22" rx="3"/>
  </g>

  <!-- MG996R, top-down, centre back -->
  <g transform="translate(118 58)">
    <rect x="-22" y="48" width="208" height="30" rx="6" fill="#26292f" stroke="#0e0f12" stroke-width="2"/>
    <circle cx="-8" cy="56" r="4" fill="#0e0f12"/><circle cx="-8" cy="70" r="4" fill="#0e0f12"/>
    <circle cx="172" cy="56" r="4" fill="#0e0f12"/><circle cx="172" cy="70" r="4" fill="#0e0f12"/>
    <rect width="164" height="150" rx="10" fill="url(#mg)" stroke="#0e0f12" stroke-width="2"/>
    <rect x="18" y="96" width="128" height="34" rx="4" fill="#e9ecf0"/>
    <text x="82" y="119" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1d1f24" text-anchor="middle">MG996R</text>
    <!-- round metal horn -->
    <circle cx="82" cy="48" r="38" fill="url(#alu)" stroke="#6f7882" stroke-width="2"/>
    <g fill="#6f7882"><circle cx="82" cy="20" r="3"/><circle cx="110" cy="48" r="3"/><circle cx="82" cy="76" r="3"/><circle cx="54" cy="48" r="3"/></g>
    <circle cx="82" cy="48" r="10" fill="#c7ccd3" stroke="#6f7882" stroke-width="2"/>
    <circle cx="82" cy="48" r="3" fill="#3a3d44"/>
  </g>

  <!-- SG90 left -->
  <g transform="translate(44 196)">
    <rect x="-14" y="28" width="124" height="18" rx="4" fill="#3f7fe6" stroke="#1d4aa6" stroke-width="2"/>
    <circle cx="-4" cy="37" r="3" fill="#1d4aa6"/><circle cx="100" cy="37" r="3" fill="#1d4aa6"/>
    <rect width="96" height="104" rx="8" fill="url(#sg90)" stroke="#1d4aa6" stroke-width="2" opacity="0.95"/>
    <text x="48" y="84" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#e6efff" text-anchor="middle">SG90</text>
    <!-- cross horn -->
    <g fill="#f5f6f8" stroke="#b6bcc6" stroke-width="1.5">
      <rect x="12" y="22" width="48" height="12" rx="6"/>
      <rect x="30" y="4" width="12" height="48" rx="6"/>
    </g>
    <circle cx="36" cy="28" r="6" fill="#e1e5ea" stroke="#b6bcc6" stroke-width="1.5"/>
  </g>

  <!-- SG90 right -->
  <g transform="translate(260 196)">
    <rect x="-14" y="28" width="124" height="18" rx="4" fill="#3f7fe6" stroke="#1d4aa6" stroke-width="2"/>
    <circle cx="-4" cy="37" r="3" fill="#1d4aa6"/><circle cx="100" cy="37" r="3" fill="#1d4aa6"/>
    <rect width="96" height="104" rx="8" fill="url(#sg90)" stroke="#1d4aa6" stroke-width="2" opacity="0.95"/>
    <text x="48" y="84" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#e6efff" text-anchor="middle">SG90</text>
    <!-- single-arm horn -->
    <g fill="#f5f6f8" stroke="#b6bcc6" stroke-width="1.5">
      <path d="M60 22 h-8 a6 6 0 0 0 0 12 h8 a8 8 0 0 0 0 -12 z" transform="rotate(-30 60 28)"/>
      <rect x="10" y="22" width="52" height="12" rx="6" transform="rotate(-30 60 28)"/>
    </g>
    <circle cx="60" cy="28" r="7" fill="#e1e5ea" stroke="#b6bcc6" stroke-width="1.5"/>
  </g>
</svg>
