<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Sensor set: HC-SR04 ultrasonic sensor, IR obstacle module, DHT11 temperature sensor and PIR motion sensor">
  <defs>
    <radialGradient id="can" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f1f3f6"/>
      <stop offset="1" stop-color="#9aa3ae"/>
    </radialGradient>
    <pattern id="mesh" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#2a2d33"/>
      <circle cx="3" cy="3" r="1.4" fill="#5b616b"/>
    </pattern>
    <pattern id="grille" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#4aa8e0"/>
      <rect x="2" y="2" width="6" height="6" rx="1" fill="#2a7fb8"/>
    </pattern>
    <radialGradient id="dome" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd3d9"/>
    </radialGradient>
    <linearGradient id="pins" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c565"/>
      <stop offset="1" stop-color="#a88a33"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="362" rx="165" ry="13" fill="#000" opacity="0.28"/>

  <!-- HC-SR04 ultrasonic -->
  <g transform="translate(30 44)">
    <rect width="214" height="100" rx="6" fill="#2256b8" stroke="#163d86" stroke-width="2"/>
    <circle cx="52" cy="50" r="38" fill="url(#can)" stroke="#6f7882" stroke-width="2"/>
    <circle cx="52" cy="50" r="28" fill="url(#mesh)"/>
    <circle cx="162" cy="50" r="38" fill="url(#can)" stroke="#6f7882" stroke-width="2"/>
    <circle cx="162" cy="50" r="28" fill="url(#mesh)"/>
    <rect x="96" y="10" width="22" height="10" rx="5" fill="url(#can)"/>
    <text x="107" y="92" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#cfe0ff" text-anchor="middle">HC-SR04</text>
    <g fill="url(#pins)">
      <rect x="85" y="100" width="6" height="18"/><rect x="99" y="100" width="6" height="18"/><rect x="113" y="100" width="6" height="18"/><rect x="127" y="100" width="6" height="18"/>
    </g>
  </g>

  <!-- IR obstacle module -->
  <g transform="translate(274 36)">
    <rect width="96" height="152" rx="6" fill="#2256b8" stroke="#163d86" stroke-width="2"/>
    <!-- emitter (clear) and receiver (black) -->
    <rect x="22" y="-18" width="18" height="34" rx="9" fill="#dfe9f5" stroke="#9aa9bd" stroke-width="2"/>
    <rect x="56" y="-18" width="18" height="34" rx="9" fill="#1d1f24" stroke="#3a3d44" stroke-width="2"/>
    <!-- trim pot -->
    <rect x="30" y="50" width="36" height="36" rx="4" fill="#3b82f6" stroke="#1e4fa8" stroke-width="2"/>
    <circle cx="48" cy="68" r="11" fill="#f2f4f7"/>
    <path d="M42 68 h12 M48 62 v12" stroke="#8a93a0" stroke-width="3" stroke-linecap="round"/>
    <rect x="20" y="100" width="56" height="16" rx="2" fill="#1d1f24"/>
    <circle cx="26" cy="130" r="4" fill="#ff5a4f"/>
    <circle cx="70" cy="130" r="4" fill="#3fd07a"/>
    <g fill="url(#pins)">
      <rect x="30" y="152" width="6" height="16"/><rect x="45" y="152" width="6" height="16"/><rect x="60" y="152" width="6" height="16"/>
    </g>
  </g>

  <!-- DHT11 temperature + humidity -->
  <g transform="translate(46 190)">
    <rect x="-10" y="92" width="112" height="44" rx="4" fill="#2256b8" stroke="#163d86" stroke-width="2"/>
    <rect width="92" height="100" rx="6" fill="url(#grille)" stroke="#2371a6" stroke-width="2"/>
    <rect x="18" y="-4" width="56" height="10" rx="4" fill="#4aa8e0"/>
    <g fill="url(#pins)">
      <rect x="26" y="136" width="6" height="18"/><rect x="43" y="136" width="6" height="18"/><rect x="60" y="136" width="6" height="18"/>
    </g>
    <text x="46" y="124" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#cfe0ff" text-anchor="middle">DHT11</text>
  </g>

  <!-- PIR motion sensor, Fresnel dome on a green board -->
  <g transform="translate(272 278)">
    <rect x="-66" y="-66" width="132" height="132" rx="8" fill="#1f8a4c" stroke="#0f5a2d" stroke-width="2"/>
    <circle r="54" fill="url(#dome)" stroke="#aeb4bd" stroke-width="2"/>
    <g fill="none" stroke="#bfc4cb" stroke-width="1.5">
      <circle r="38"/><circle r="22"/>
      <path d="M-54 0 H54 M0 -54 V54 M-38 -38 L38 38 M38 -38 L-38 38"/>
    </g>
    <circle r="7" fill="#e6e9ee"/>
  </g>

  <!-- dupont wires tying the set together -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M118 162 C 120 214, 190 214, 206 262" stroke="#d64545"/>
    <path d="M132 162 C 140 206, 214 206, 222 222" stroke="#1d1f24"/>
  </g>
</svg>
